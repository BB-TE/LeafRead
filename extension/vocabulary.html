<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="leafread-reader" content="true"><title>LeafRead · 生词本</title><link rel="stylesheet" href="vocabulary.css"><script defer src="core.js"></script><script defer src="shared.js"></script><script defer src="vocabulary.js"></script></head>
<body><header class="topbar"><span class="brand">❧ LeafRead</span><span class="nav-hint">网页查词 · 生词本</span></header>
<main><p class="eyebrow">YOUR VOCABULARY</p><div class="page-heading"><h1>留下想记住的词</h1><span id="wordCount">0 个词</span></div>
<p class="description">网页和手动查询中收藏的单词，都在这里。</p>
<div class="tools"><label for="filterWords" class="sr-only">查找收藏的单词</label><input id="filterWords" type="search" placeholder="查找收藏的单词" autocomplete="off"><button id="exportWords" disabled>↓ 导出 CSV</button></div>
<p id="vocabStatus" role="status" aria-live="polite">正在读取生词本……</p>
<div id="vocabularyList" aria-label="收藏的单词"></div>
<p class="local-note">生词保存在当前浏览器。更换设备或移除扩展前，可以先导出备份。</p>
</main></body></html>
